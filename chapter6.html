        <h2>
            When life became difficult, who reminded you that you weren't facing it alone?
        </h2>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            A. My family.
        </button>

        <button
            class="answer-btn"
            data-correct="true"
            onclick="selectAnswer(this)">

            B. The belief that you have someone who you loves more than anything.
        </button>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            C. Someone who unexpectedly entered my life.
        </button>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            D. The belief that someone would always care.
        </button>
