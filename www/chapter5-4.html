<div class="container">

    <div class="card">

        <div class="heart">❤️</div>

        <h1>Chapter 5</h1>

        <p class="subtitle">
            Reflection 4 of 10
        </p>

        <h2>
            Which dream has quietly stayed with you, no matter how much life changed around it?
        </h2>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            A. A dream of peace.
        </button>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            B. A dream of success.
        </button>

        <button
            class="answer-btn"
            data-correct="true"
            onclick="selectAnswer(this)">

            C. A dream that has become part of who I am.
        </button>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            D. A dream I haven't shared with many people.
        </button>
