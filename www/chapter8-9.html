        <h2>
            If every experience in your life became a single photograph, which one would you frame forever?
        </h2>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            A. The photo that reminds me where I started.
        </button>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            B. The photo that reminds me how far I've come.
        </button>

        <button
            class="answer-btn"
            data-correct="true"
            onclick="selectAnswer(this)">

            C. The photo that holds someone irreplaceable.
        </button>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            D. The photo that still feels alive whenever I look at it.
        </button>
