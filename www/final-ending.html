<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The End</title>

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;

}

body{

background:#000;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
font-family:Arial,sans-serif;

}

.container{

text-align:center;
padding:25px;

}

.fade{

opacity:0;
animation:fade 2s forwards;

}

.delay1{

animation-delay:1s;

}

.delay2{

animation-delay:4s;

}

.delay3{

animation-delay:7s;

}

.delay4{

animation-delay:10s;

}

.delay5{

animation-delay:13s;

}

.quote{

color:#ff69b4;
font-size:30px;
font-weight:bold;
margin-bottom:20px;

}

.hearts{

font-size:45px;
margin-top:25px;

}

.end{

color:white;
font-size:20px;
margin-top:35px;

}

button{

margin-top:45px;
padding:15px 35px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
background:#ff69b4;
color:white;

}

button:hover{

transform:scale(1.05);

}

@keyframes fade{

to{

opacity:1;

}

}

</style>

</head>

<body>

<div class="container">

<div class="quote fade delay1">

If my life were written in a book...

</div>

<div class="quote fade delay2">

...they'd be my favorite chapter.

</div>

<div class="hearts fade delay3">

🖤

</div>

<div class="hearts fade delay4">

🖤 🩷

</div>

<div class="hearts fade delay5">

🖤 🩷 💛 💜

</div>

<div class="end fade delay5">

<br>

Thank you for reading

<br><br>

<b>The Quiet Side of Me</b>

<br><br>

— The End —

</div>

<button
class="fade delay5"
onclick="location.href='index.html'">

📖 Close My Book

</button>

</div>

</body>

</html>
