        <h2>
            If someone described the people closest to you, what would you hope they noticed first?
        </h2>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            A. Their kindness.
        </button>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            B. Their loyalty.
        </button>

        <button
            class="answer-btn"
            data-correct="true"
            onclick="selectAnswer(this)">

            C. The way they accept me for who I am.
        </button>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            D. The happiness they bring into my life.
        </button>
