        </h2>

        <button
            class="answer-btn"
            data-correct="false"

            A. The happiest day of my life.
        </button>

            class="answer-btn"
            data-correct="false"

            B. A quiet moment that changed me.
        </button>

            class="answer-btn"
            data-correct="true"

            C. A memory with the person I always wanted to be with.
        </button>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            D. The day I truly felt understood.
