<div class="container">

        <h1>Chapter 8</h1>

        <p class="subtitle">
            Reflection 5 of 10
        </p>

        <h2>
            If you could relive one experience—not to change it, but to feel it once more—which would you choose?
        </h2>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            A. The experience that made me happiest.
        </button>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            B. The experience that changed my perspective.
        </button>

        <button
            class="answer-btn"
            data-correct="true"
            onclick="selectAnswer(this)">

            C. The experience I wasn't ready to let go of.
        </button>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            D. The experience that still feels unfinished.
        </button>
