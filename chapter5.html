<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style.css">

<body>

<div class="container">

    <div class="card">

        <div class="heart">❤️</div>

        <h1>Chapter 5</h1>

        <p class="subtitle">
            Reflection 1 of 10
        </p>

        <h2>
            If one dream was guaranteed to come true, but you could choose only one, which would you protect?
        </h2>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            A. The dream that would change my life forever.
        </button>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            B. The dream that would make the people I love proud.
        </button>

        <button
            class="answer-btn"
            data-correct="true"
            onclick="selectAnswer(this)">

            C. The dream I've carried quietly for years.
        </button>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            D. The dream that still feels impossible today.
        </button>

        <br><br>

        <button
            id="nextBtn"
            class="next-btn"
            onclick="window.location.href='chapter5-2.html'"
            disabled>

            Next →
        </button>

    </div>

</div>
