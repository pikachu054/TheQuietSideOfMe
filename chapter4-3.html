<body>

<div class="container">

    <div class="card">

        <div class="heart">❤️</div>

        <h1>Chapter 4</h1>

        <p class="subtitle">
            Reflection 3 of 10
        </p>

        <h2>
            If your younger self could ask you one question today, which answer would make them smile the most?
        </h2>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            A. "You never gave up."
        </button>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            B. "You found peace."
        </button>

        <button
            class="answer-btn"
            data-correct="true"
            onclick="selectAnswer(this)">

            C. "You stayed true to yourself."
        </button>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            D. "You're still becoming the person you dreamed of."
        </button>

        <br><br>

        <button
            id="nextBtn"
            class="next-btn"
            onclick="window.location.href='chapter4-4.html'"
