        <h2>
            Which place feels the most like home to your heart, even if it isn't your actual home?
        </h2>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            A. Somewhere surrounded by nature.
        </button>

        <button
            class="answer-btn"
            data-correct="true"
            onclick="selectAnswer(this)">

            B. A place filled with unforgettable memories and someone important to me.
        </button>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">

            C. A place where I feel completely at peace.
        </button>

        <button
            class="answer-btn"
            data-correct="false"
            onclick="selectAnswer(this)">
